<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運轉轉樂 (支援即時修改權重)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
        }
        /* 左側設定區 */
        .settings-panel {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            flex: 1;
            min-width: 350px;
            max-width: 450px;
        }
        .settings-panel h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        #itemName { flex: 2; }
        #itemWeight { flex: 1; text-align: center; }
        .btn-add {
            padding: 10px 15px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-add:hover { background-color: #27ae60; }
        
        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 5px solid #ccc;
        }
        .item-info {
            display: flex;
            gap: 15px;
            align-items: center;
            flex: 1;
        }
        .item-name {
            font-weight: bold;
            flex: 1;
        }
        .weight-edit-group {
            display: flex;
            align-items: center;
            gap: 5px;
            background-color: #e8f4f8;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .weight-edit-group label {
            font-size: 12px;
            font-weight: bold;
            color: #2980b9;
        }
        .weight-edit-group input {
            width: 40px;
            padding: 2px 5px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
        }
        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        .btn-delete:hover { background-color: #c0392b; }

        /* 右側轉盤區 */
        .wheel-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 350px;
        }
        .wheel-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin-bottom: 30px;
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #e74c3c;
            z-index: 10;
            filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.3));
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
            transition: transform cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .btn-spin {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            background-color: #f39c12;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.3s;
        }
        .btn-spin:active { transform: scale(0.95); }
        .btn-spin:hover { background-color: #e67e22; }
        .btn-spin:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        #resultDisplay {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #d35400;
            min-height: 35px;
            text-align: center;
        }
    </style>
</head>
<body>

<h1>🎡 幸運轉轉樂</h1>

<div class="main-container">
    <div class="settings-panel">
        <h2>項目設定</h2>
        <div class="input-group">
            <input type="text" id="itemName" placeholder="輸入項目名稱" autocomplete="off">
            <input type="number" id="itemWeight" placeholder="權重" value="1" min="1">
            <button class="btn-add" onclick="addItem()">新增</button>
        </div>
        <ul class="item-list" id="itemList">
            </ul>
    </div>

    <div class="wheel-panel">
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
        </div>
        <button class="btn-spin" id="spinBtn" onclick="spin()">開始轉動！</button>
        <div id="resultDisplay">請點擊按鈕開始轉動</div>
    </div>
</div>

<script>
    const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#1A535C', '#FF9F1C', '#9B5DE5', '#F15BB5', '#00BBF9', '#00F5D4', '#8AC926'];
    
    let items = [
        { id: 1, name: '大吉', weight: 1, color: colors[0] },
        { id: 2, name: '中吉', weight: 3, color: colors[1] },
        { id: 3, name: '小吉', weight: 5, color: colors[2] }
    ];
    let nextId = 4;
    let colorIndex = 3;

    let currentRotation = 0; 
    let isSpinning = false;  

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const resultDisplay = document.getElementById('resultDisplay');
    const spinBtn = document.getElementById('spinBtn');

    function init() {
        renderList();
        drawWheel();
    }

    // 更新：渲染列表時加上「可編輯的權重輸入框」
    function renderList() {
        const listEl = document.getElementById('itemList');
        listEl.innerHTML = '';
        
        items.forEach(item => {
            const li = document.createElement('li');
            li.className = 'item-row';
            li.style.borderLeftColor = item.color;
            li.innerHTML = `
                <div class="item-info">
                    <span class="item-name">${item.name}</span>
                    <div class="weight-edit-group">
                        <label>權重</label>
                        <input type="number" value="${item.weight}" min="1" 
                               onchange="updateWeight(${item.id}, this.value)">
                    </div>
                </div>
                <button class="btn-delete" onclick="removeItem(${item.id})">刪除</button>
            `;
            listEl.appendChild(li);
        });
    }

    // 新增：即時更新權重的函數
    function updateWeight(id, newWeightValue) {
        if (isSpinning) {
            alert('轉動中無法修改權重！');
            renderList(); // 恢復成原本的數字
            return;
        }

        const parsedWeight = parseInt(newWeightValue);
        
        // 防呆：輸入不合法或小於 1 的數字
        if (isNaN(parsedWeight) || parsedWeight <= 0) {
            alert('權重必須是超過 0 的數字！');
            renderList(); // 恢復成原本的數字
            return;
        }

        // 找到該項目並更新權重
        const itemIndex = items.findIndex(item => item.id === id);
        if (itemIndex !== -1) {
            items[itemIndex].weight = parsedWeight;
            drawWheel(); // 重新繪製轉盤，讓畫面即時連動
        }
    }

    function addItem() {
        const nameInput = document.getElementById('itemName');
        const weightInput = document.getElementById('itemWeight');
        const name = nameInput.value.trim();
        const weight = parseInt(weightInput.value);

        if (!name) {
            alert('請輸入項目名稱！');
            return;
        }
        if (isNaN(weight) || weight <= 0) {
            alert('權重必須是超過 0 的數字！');
            return;
        }

        items.push({
            id: nextId++,
            name: name,
            weight: weight,
            color: colors[colorIndex % colors.length]
        });
        colorIndex++;

        nameInput.value = '';
        weightInput.value = '1';
        
        renderList();
        drawWheel();
    }

    function removeItem(id) {
        if(isSpinning) return; 
        items = items.filter(item => item.id !== id);
        renderList();
        drawWheel();
    }

    function drawWheel() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (items.length === 0) {
            ctx.fillStyle = '#ccc';
            ctx.beginPath();
            ctx.arc(250, 250, 250, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = '#666';
            ctx.font = '24px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('請新增項目', 250, 260);
            return;
        }

        const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
        let startAngle = 0; 

        items.forEach(item => {
            const sliceAngle = (item.weight / totalWeight) * 2 * Math.PI;
            
            ctx.beginPath();
            ctx.moveTo(250, 250); 
            ctx.arc(250, 250, 250, startAngle, startAngle + sliceAngle);
            ctx.fillStyle = item.color;
            ctx.fill();
            ctx.stroke();

            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(startAngle + sliceAngle / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 24px sans-serif";
            ctx.shadowColor = "rgba(0,0,0,0.5)";
            ctx.shadowBlur = 4;
            ctx.fillText(item.name, 230, 8); 
            ctx.restore();

            startAngle += sliceAngle;
        });
    }

    function spin() {
        if (items.length === 0) {
            alert('沒有項目可以轉喔，請先新增！');
            return;
        }
        if (isSpinning) return;
        
        isSpinning = true;
        spinBtn.disabled = true;
        resultDisplay.innerText = "轉動中...";
        resultDisplay.style.color = "#7f8c8d";

        const randomDegree = Math.floor(Math.random() * 360);
        const spinDegree = 1800 + randomDegree;
        currentRotation += spinDegree;

        const duration = 5; 
        canvas.style.transitionDuration = `${duration}s`;
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            calculateResult();
            isSpinning = false;
            spinBtn.disabled = false;
        }, duration * 1000);
    }

    function calculateResult() {
        const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
        const actualRotation = currentRotation % 360;
        const pointerAngleInWheel = (270 - actualRotation + 360) % 360;
        const pointerRadian = pointerAngleInWheel * (Math.PI / 180);

        let startRadian = 0;
        let winner = null;

        for (let item of items) {
            const sliceRadian = (item.weight / totalWeight) * 2 * Math.PI;
            if (pointerRadian >= startRadian && pointerRadian < startRadian + sliceRadian) {
                winner = item;
                break;
            }
            startRadian += sliceRadian;
        }

        if (winner) {
            resultDisplay.innerText = `🎉 恭喜轉中：【 ${winner.name} 】 🎉`;
            resultDisplay.style.color = "#d35400";
        }
    }

    init();
</script>

</body>
</html>
