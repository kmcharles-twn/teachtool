<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會員登入</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background-color: #f3f4f6; padding: 16px;
    }
    .card {
      background: #ffffff; width: 100%; max-width: 380px; padding: 32px;
      border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    h2 { margin: 0 0 24px 0; text-align: center; color: #1f2937; font-size: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: #4b5563; font-size: 14px; font-weight: 500; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px;
    }
    input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    .btn {
      width: 100%; padding: 11px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background-color: #2563eb; color: white; margin-top: 4px; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-google {
      background-color: #ffffff; color: #374151; border: 1px solid #d1d5db;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-google:hover { background-color: #f9fafb; }
    .btn-resend { background-color: #f59e0b; color: white; margin-top: 10px; display: none; }
    .divider {
      display: flex; align-items: center; text-align: center; margin: 20px 0; color: #9ca3af; font-size: 13px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e5e7eb; }
    .divider span { padding: 0 12px; }
    .links { display: flex; justify-content: space-between; margin-top: 16px; font-size: 13px; }
    .links a { color: #2563eb; text-decoration: none; cursor: pointer; }
    .links a:hover { text-decoration: underline; }
    #message { margin-top: 16px; padding: 10px; border-radius: 6px; font-size: 14px; line-height: 1.5; display: none; }
    .msg-error { background-color: #fee2e2; color: #b91c1c; display: block !important; }
    .msg-warning { background-color: #fef3c7; color: #b45309; display: block !important; }
    .msg-success { background-color: #dcfce7; color: #15803d; display: block !important; }
    .msg-info { background-color: #dbeafe; color: #1d4ed8; display: block !important; }
  </style>
</head>
<body>

  <div class="card">
    <h2>會員登入</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">電子郵件</label>
        <input type="email" id="email" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">密碼</label>
        <input type="password" id="password" placeholder="請輸入密碼" required>
      </div>
      <button type="submit" class="btn btn-primary">登入</button>
    </form>

    <button type="button" class="btn btn-resend" id="resendBtn">重新寄送驗證信</button>

    <div class="links">
      <a id="forgotPasswordLink">忘記密碼？</a>
      <a href="register.html">使用邀請碼註冊</a>
    </div>

    <div class="divider"><span>或</span></div>

    <button type="button" class="btn btn-google" id="googleLoginBtn">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
      </svg>
      使用 Google 帳號登入
    </button>

    <div id="message"></div>
  </div>

  <script type="module">
    import { auth, googleProvider, db } from "./firebase-config.js";
    import { 
      signInWithEmailAndPassword, 
      signInWithPopup,
      sendEmailVerification,
      sendPasswordResetEmail,
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

    const messageEl = document.getElementById('message');
    const resendBtn = document.getElementById('resendBtn');
    let unverifiedUser = null;

    function showMessage(text, type) {
      messageEl.innerHTML = text;
      messageEl.className = `msg-${type}`;
    }

    // 1. 一般帳密登入
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      resendBtn.style.display = "none";
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        showMessage("正在登入...", "info");
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        if (!user.emailVerified) {
          unverifiedUser = user;
          showMessage("您的信箱尚未完成驗證，請先前往信箱點擊驗證連結。", "warning");
          resendBtn.style.display = "block";
          await signOut(auth);
          return;
        }

        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (!userDoc.exists()) {
          await signOut(auth);
          showMessage("找不到您的註冊資料，請先使用邀請碼註冊。", "error");
          return;
        }

        showMessage(`登入成功！歡迎回來，${userDoc.data().name}！`, "success");
        window.location.href = "student_hub.html";

      } catch (error) {
        showMessage("電子郵件或密碼錯誤，請重新確認。", "error");
      }
    });

    // 2. Google 帳號登入（必須已於註冊頁使用邀請碼建檔才放行）
    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      resendBtn.style.display = "none";
      try {
        showMessage("正在開啟 Google 登入...", "info");
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;

        const userSnap = await getDoc(doc(db, "users", user.uid));

        if (!userSnap.exists()) {
          await signOut(auth);
          showMessage(`此 Google 帳號 (${user.email}) 尚未開通權限！<br>請先點上方「<strong>使用邀請碼註冊</strong>」完成開通。`, "error");
          return;
        }

        showMessage(`登入成功！歡迎回來，${userSnap.data().name}！`, "success");
        window.location.href = "student_hub.html";

      } catch (error) {
        if (error.code !== 'auth/popup-closed-by-user') {
          showMessage(`Google 登入失敗：${error.message}`, "error");
        } else {
          messageEl.style.display = "none";
        }
      }
    });

    // 3. 重寄驗證信
    resendBtn.addEventListener('click', async () => {
      if (!unverifiedUser) return;
      try {
        await sendEmailVerification(unverifiedUser);
        showMessage("驗證信已重新寄出，請至信箱查收！", "info");
        resendBtn.style.display = "none";
      } catch (error) {
        showMessage("寄送過於頻繁，請稍後再試。", "error");
      }
    });

    // 4. 忘記密碼
    document.getElementById('forgotPasswordLink').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showMessage("請先在上方輸入「電子郵件」，再點擊忘記密碼。", "warning");
        document.getElementById('email').focus();
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        showMessage(`重設密碼信已寄送至 ${email}，請前往信箱設定新密碼。`, "info");
      } catch (error) {
        showMessage("無法寄送重設信，請確認信箱格式是否正確。", "error");
      }
    });
  </script>
</body>
</html>
